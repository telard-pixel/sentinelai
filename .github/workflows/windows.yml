name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versione
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT; else echo "v=1.0.0-prova.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT; fi

      # ---------------------------------------------------------------- app (React)
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Compila l'app
        working-directory: frontend
        env: { CI: "false", GENERATE_SOURCEMAP: "false" }
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm run build

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # ---------------------------------------------------------------- modello YOLOv8n -> ONNX (una volta, poi in cache)
      - name: Cache modello
        id: modello
        uses: actions/cache@v4
        with: { path: models/yolov8n.onnx, key: yolov8n-onnx-ultralytics-8.3.55-opset12 }
      - name: Esporta YOLOv8n in ONNX
        if: steps.modello.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m venv C:\esporta
          C:\esporta\Scripts\python -m pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          C:\esporta\Scripts\python -m pip install -q ultralytics==8.3.55 onnx==1.17.0
          C:\esporta\Scripts\python -c "from ultralytics import YOLO; YOLO('yolov8n.pt').export(format='onnx', imgsz=640, opset=12, simplify=False, dynamic=False)"
          New-Item -ItemType Directory -Force models | Out-Null
          Move-Item yolov8n.onnx models\yolov8n.onnx -Force
          Get-Item models\yolov8n.onnx | Format-List Name, Length

      # ---------------------------------------------------------------- exe
      - name: Costruisci SentinelAI.exe
        working-directory: desktop
        run: |
          python -m pip install -q -r requirements-desktop.txt
          python make_version.py ${{ steps.v.outputs.v }}
          pyinstaller --noconfirm --clean --distpath ..\dist --workpath ..\build-exe sentinelai.spec

      - name: Prova l'exe (server, modello ONNX, streaming, clip H.264, Excel)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SentinelAI\SentinelAI.exe -ArgumentList '--prova', "$PWD\prova.txt" -Wait -PassThru
          Get-Content prova.txt
          if ($p.ExitCode -ne 0) { Write-Error "prova fallita (codice $($p.ExitCode))"; exit 1 }

      # ---------------------------------------------------------------- installer
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress | Out-Null }
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /Qp /DVersion=${{ steps.v.outputs.v }} desktop\installer.iss
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Prova l'installer (installa in silenzio e riprova)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\SentinelAI-Setup-*.exe).FullName
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=""' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installazione fallita"; exit 1 }
          $exe = "$env:LOCALAPPDATA\Programs\SentinelAI\SentinelAI.exe"
          $q = Start-Process -FilePath $exe -ArgumentList '--prova', "$PWD\prova2.txt" -Wait -PassThru
          Get-Content prova2.txt
          if ($q.ExitCode -ne 0) { Write-Error "prova dopo l'installazione fallita"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: SentinelAI-Setup-${{ steps.v.outputs.v }}
          path: dist/SentinelAI-Setup-*.exe

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/SentinelAI-Setup-*.exe --title "SentinelAI $GITHUB_REF_NAME" --notes "Installer per Windows 10/11 (64 bit). Scarica SentinelAI-Setup e avvialo."
