name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 1.0.9 (revisione): di base solo lettura; scrive (release) solo il job "release", e solo sui tag.
permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }

      - name: Versione
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT; else echo "v=1.0.0-prova.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT; fi

      # ---------------------------------------------------------------- app (React)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Compila l'app
        working-directory: frontend
        env: { CI: "false", GENERATE_SOURCEMAP: "false" }
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm run build

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }

      # ---------------------------------------------------------------- modello YOLO11s -> ONNX 640x448 (una volta, poi in cache)
      - name: Cache modello
        id: modello
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with: { path: models/yolo11s.onnx, key: yolo11s-448x640-onnx-ultralytics-8.3.55-opset12-pt85a76fe8 }
      - name: Esporta YOLO11s in ONNX
        if: steps.modello.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m venv C:\esporta
          # torch e torchvision insieme e fissati: altrimenti pip prende un torch nuovo il cui esportatore vuole onnxscript.
          C:\esporta\Scripts\python -m pip install -q torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          C:\esporta\Scripts\python -m pip install -q ultralytics==8.3.55 onnx==1.17.0 torch==2.5.1 torchvision==0.20.1 --extra-index-url https://download.pytorch.org/whl/cpu
          C:\esporta\Scripts\python -c "import torch; print('torch', torch.__version__)"
          # 1.0.9 (revisione): il .pt si scarica da un indirizzo fisso e si controlla l'impronta prima di aprirlo
          # (torch.load di un file alterato può eseguire codice).
          Invoke-WebRequest -Uri https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11s.pt -OutFile yolo11s.pt -MaximumRetryCount 6 -RetryIntervalSec 30
          $h = (Get-FileHash yolo11s.pt -Algorithm SHA256).Hash.ToLower()
          if ($h -ne '85a76fe86dd8afe384648546b56a7a78580c7cb7b404fc595f97969322d502d5') { Write-Error "yolo11s.pt con impronta sbagliata: $h"; exit 1 }
          C:\esporta\Scripts\python -c "from ultralytics import YOLO; YOLO('yolo11s.pt').export(format='onnx', imgsz=(448, 640), opset=12, simplify=False, dynamic=False)"
          New-Item -ItemType Directory -Force models | Out-Null
          Move-Item yolo11s.onnx models\yolo11s.onnx -Force
          Get-Item models\yolo11s.onnx | Format-List Name, Length

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: modello-onnx, path: models/yolo11s.onnx, retention-days: 1 }

      # ---------------------------------------------------------------- exe
      - name: Costruisci SentinelAI.exe
        working-directory: desktop
        run: |
          python -m pip install -q -r requirements-desktop.txt
          python make_version.py ${{ steps.v.outputs.v }}
          pyinstaller --noconfirm --clean --distpath ..\dist --workpath ..\build-exe sentinelai.spec

      - name: Prova l'exe (server, modello ONNX, streaming, clip H.264, Excel)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SentinelAI\SentinelAI.exe -ArgumentList '--prova', "$PWD\prova.txt" -Wait -PassThru
          if (Test-Path prova.txt) { Get-Content prova.txt } else { Write-Host "prova.txt non scritto" }
          if ($p.ExitCode -ne 0) {
            Write-Host "--- registro (codice $($p.ExitCode))"
            Get-Content "$env:LOCALAPPDATA\SentinelAI\sentinelai.log" -Tail 60 -ErrorAction SilentlyContinue
            Get-ChildItem "$env:LOCALAPPDATA\SentinelAI" -ErrorAction SilentlyContinue | Select-Object Name, Length
            Write-Error "prova fallita (codice $($p.ExitCode))"; exit 1
          }

      - name: Prova istanza unica (avviato due volte = un solo SentinelAI)
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist\SentinelAI\SentinelAI.exe).Path
          Start-Process -FilePath $exe -ArgumentList '--minimizzato'
          Start-Sleep -Seconds 2
          Start-Process -FilePath $exe -ArgumentList '--minimizzato'
          Start-Sleep -Seconds 40
          $n = @(Get-Process SentinelAI -ErrorAction SilentlyContinue).Count
          $porta = Get-Content "$env:LOCALAPPDATA\SentinelAI\porta.txt" -ErrorAction SilentlyContinue
          Write-Host "processi SentinelAI: $n  porta: $porta"
          $ok = $false
          try { $ok = (Invoke-RestMethod "http://127.0.0.1:$porta/api/health").status -eq 'ok' } catch {}
          Get-Content "$env:LOCALAPPDATA\SentinelAI\sentinelai.log" -Tail 15
          Get-Process SentinelAI -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($n -ne 1 -or -not $ok) { Write-Error "attesi 1 processo e server vivo (trovati $n, server $ok)"; exit 1 }

      - name: Prova la finestra propria (WebView2, X nasconde, secondo avvio la riporta)
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class W { [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h); }
          "@
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          $exe = (Resolve-Path dist\SentinelAI\SentinelAI.exe).Path
          $fail = @()
          Start-Process -FilePath $exe
          Start-Sleep -Seconds 45
          $p = Get-Process SentinelAI -ErrorAction SilentlyContinue | Select-Object -First 1
          $porta = Get-Content "$env:LOCALAPPDATA\SentinelAI\porta.txt"
          Write-Host "titolo finestra: '$($p.MainWindowTitle)'  handle: $($p.MainWindowHandle)"
          if ($p.MainWindowTitle -ne 'SentinelAI') { $fail += 'finestra SentinelAI non trovata' }
          $wv = @(Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Where-Object { $_.CommandLine -like '*finestra-app*' })
          $edge = @(Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" | Where-Object { $_.CommandLine -like '*--app=*' })
          Write-Host "processi WebView2 nostri: $($wv.Count)  Edge --app: $($edge.Count)"
          if ($wv.Count -lt 1) { $fail += 'WebView2 non partito' }
          if ($edge.Count -gt 0) { $fail += 'aperto Edge invece della finestra propria' }
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\finestra.png")
          # secondo avvio: nessun secondo programma
          Start-Process -FilePath $exe; Start-Sleep -Seconds 8
          $n = @(Get-Process SentinelAI).Count
          if ($n -ne 1) { $fail += "secondo avvio: $n processi" }
          # X: la finestra si nasconde, il server resta vivo
          $null = $p.CloseMainWindow(); Start-Sleep -Seconds 4
          $h = $p.MainWindowHandle
          $alive = -not $p.HasExited
          $ok = $false; try { $ok = (Invoke-RestMethod "http://127.0.0.1:$porta/api/health").status -eq 'ok' } catch {}
          Write-Host "dopo la X: processo vivo $alive, server $ok, visibile $([W]::IsWindowVisible($h))"
          if (-not $alive -or -not $ok) { $fail += 'la X ha spento il programma' }
          if ([W]::IsWindowVisible($h)) { $fail += 'la X non ha nascosto la finestra' }
          # nuovo avvio: la finestra torna visibile
          Start-Process -FilePath $exe; Start-Sleep -Seconds 8
          Write-Host "dopo il nuovo avvio: visibile $([W]::IsWindowVisible($h)), processi $(@(Get-Process SentinelAI).Count)"
          if (-not [W]::IsWindowVisible($h)) { $fail += 'il nuovo avvio non ha riportato la finestra' }
          Get-Content "$env:LOCALAPPDATA\SentinelAI\sentinelai.log" -Tail 20
          Get-Process SentinelAI -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($fail.Count) { Write-Error ($fail -join '; '); exit 1 }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: finestra, path: finestra.png, if-no-files-found: ignore, retention-days: 1 }

      # ---------------------------------------------------------------- installer
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress | Out-Null }
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /Qp /DVersion=${{ steps.v.outputs.v }} desktop\installer.iss
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Prova l'installer (installa in silenzio e riprova)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\SentinelAI-Setup-*.exe).FullName
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=""' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installazione fallita"; exit 1 }
          $exe = "$env:LOCALAPPDATA\Programs\SentinelAI\SentinelAI.exe"
          $q = Start-Process -FilePath $exe -ArgumentList '--prova', "$PWD\prova2.txt" -Wait -PassThru
          Get-Content prova2.txt
          if ($q.ExitCode -ne 0) { Write-Error "prova dopo l'installazione fallita"; exit 1 }

      - name: Prova l'aggiornamento dall'app (chiude, reinstalla in silenzio, si riapre)
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\SentinelAI\SentinelAI.exe"
          $setup = (Get-ChildItem dist\SentinelAI-Setup-*.exe).FullName
          $log = "$env:LOCALAPPDATA\SentinelAI\sentinelai.log"
          Get-Process SentinelAI -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process -FilePath $exe -ArgumentList '--prova-aggiornamento', "`"$setup`"", '--minimizzato'
          Start-Sleep -Seconds 8
          $pid1 = (Get-Process SentinelAI | Select-Object -First 1).Id
          Write-Host "prima: processo $pid1"
          $fail = @(); $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            $p = @(Get-Process SentinelAI -ErrorAction SilentlyContinue)
            if ($p.Count -eq 1 -and $p[0].Id -ne $pid1 -and (Select-String -Path $log -Pattern 'installazione riuscita' -Quiet)) {
              $porta = Get-Content "$env:LOCALAPPDATA\SentinelAI\porta.txt"
              try { $ok = (Invoke-RestMethod "http://127.0.0.1:$porta/api/health").status -eq 'ok' } catch {}
              if ($ok) { break }
            }
          }
          $n = @(Get-Process SentinelAI -ErrorAction SilentlyContinue).Count
          Write-Host "dopo: processi $n, server $ok"
          Get-Content "$env:LOCALAPPDATA\SentinelAI\aggiornamento\setup.log" -Tail 5 -ErrorAction SilentlyContinue
          Get-Content $log -Tail 25
          Get-Process SentinelAI -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { $fail += 'dopo l''aggiornamento SentinelAI non è ripartito' }
          if ($n -ne 1) { $fail += "processi dopo l'aggiornamento: $n" }
          if ($fail.Count) { Write-Error ($fail -join '; '); exit 1 }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SentinelAI-Setup-${{ steps.v.outputs.v }}
          path: dist/SentinelAI-Setup-*.exe
          retention-days: 1

  # ---------------------------------------------------------------- pacchetto per il CT Linux (1.0.12)
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Versione
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT; else echo "v=1.0.0-prova.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Compila l'app
        working-directory: frontend
        env: { CI: "false", GENERATE_SOURCEMAP: "false" }
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm run build
      - name: Prova l'aggiornamento Linux (firma, ritorno indietro)
        run: sh linux/prova-aggiorna.sh
      # stesso Python del CT (3.11): con quello del runner le librerie fissate non hanno pacchetti pronti
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - name: Prove automatiche del server (linea, zone, clip, accesso, API)
        run: |
          python -m venv /tmp/prove
          /tmp/prove/bin/pip install -q -r tests/requirements-prove.txt
          /tmp/prove/bin/python -m pytest tests -q
      - name: Pacchetto
        run: |
          V=${{ steps.v.outputs.v }}
          echo "$V" > VERSIONE
          mkdir -p dist
          find backend desktop linux -name __pycache__ -prune -exec rm -rf {} +
          tar -czf "dist/SentinelAI-linux-$V.tar.gz" --owner=0 --group=0 --sort=name \
            --exclude=backend/_riferimento --exclude=backend/Dockerfile --exclude=backend/requirements.txt \
            VERSIONE backend desktop/sentinel_desktop.py linux frontend/build
          tar -tzf "dist/SentinelAI-linux-$V.tar.gz" | grep -v '^frontend/build/static/' 
          ls -la dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SentinelAI-linux-${{ steps.v.outputs.v }}
          path: dist/SentinelAI-linux-*.tar.gz
          retention-days: 1

  release:
    needs: [exe, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: "SentinelAI-*", path: dist, merge-multiple: true }
      - name: Pubblica la release
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/SentinelAI-Setup-*.exe dist/SentinelAI-linux-*.tar.gz --repo "$GITHUB_REPOSITORY" --title "SentinelAI $GITHUB_REF_NAME" --notes "Installer per Windows 10/11 (64 bit). Scarica SentinelAI-Setup e avvialo."
