# SentinelAI: l'app e il backend dallo stesso indirizzo (serve per login, cookie, video e per installarla).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # WebSocket dello streaming
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;               # con la porta: serve al controllo di Origin
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;      # non si accoda quello mandato dal browser
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Service worker e manifest sempre freschi, altrimenti l'app installata non si aggiorna.
    location = /sw.js        { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.json { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /static/        { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
