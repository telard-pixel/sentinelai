# SentinelAI Vision Guard - avvio:  cp backend/.env.example backend/.env  (e completa)  poi  docker compose up -d --build
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - ./dati/mongo:/data/db
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DATA_DIR: /data
      TZ: Europe/Rome
    volumes:
      - ./dati/backend:/data
    depends_on: [mongo]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on: [backend]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
